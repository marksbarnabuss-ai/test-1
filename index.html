<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LM Studio Chat</title><style>
    :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #17181a;
        --muted: #73777d;
        --border: #e1e3e6;
        --accent: #111111;
        --danger: #c62828;
        --success: #267a3b;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
                     "Segoe UI", sans-serif;
    }

    .app {
        max-width: 720px;
        min-height: 100vh;
        margin: auto;
        display: flex;
        flex-direction: column;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(244, 245, 247, 0.94);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        padding: 16px;
    }

    .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }

    h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.4px;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
    }

    .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #aaa;
    }

    .status-dot.connected {
        background: var(--success);
    }

    .status-dot.error {
        background: var(--danger);
    }

    main {
        flex: 1;
        padding: 16px;
        padding-bottom: 150px;
    }

    .setup-card,
    .message {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
    }

    .setup-card {
        padding: 16px;
        margin-bottom: 16px;
    }

    .setup-card h2 {
        font-size: 15px;
        margin: 0 0 14px;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
    }

    input,
    select,
    textarea,
    button {
        font: inherit;
    }

    input,
    select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
        border-color: #888;
    }

    .field {
        margin-bottom: 12px;
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    button {
        border: 0;
        border-radius: 10px;
        padding: 11px 14px;
        cursor: pointer;
        font-weight: 600;
    }

    .button-secondary {
        background: #eceef0;
        color: var(--text);
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .messages {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .message {
        padding: 14px;
        line-height: 1.55;
        overflow-wrap: anywhere;
    }

    .message.user {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
        margin-left: 28px;
    }

    .message.assistant {
        margin-right: 12px;
    }

    .message-label {
        font-size: 11px;
        font-weight: 700;
        opacity: 0.6;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .message-content {
        white-space: pre-wrap;
    }

    .cursor {
        display: inline-block;
        width: 7px;
        height: 16px;
        background: currentColor;
        margin-left: 3px;
        vertical-align: -2px;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        50% {
            opacity: 0;
        }
    }

    .response-info {
        margin-top: 12px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
    }

    .response-info summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-top: 10px;
    }

    .stat {
        background: #f5f6f7;
        border-radius: 10px;
        padding: 9px;
    }

    .stat-title {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
    }

    .stat-value {
        margin-top: 3px;
        font-weight: 700;
        font-size: 14px;
    }

    .raw-response {
        margin-top: 10px;
        background: #18191b;
        color: #e7e7e7;
        padding: 10px;
        border-radius: 10px;
        overflow-x: auto;
        font-size: 11px;
        white-space: pre-wrap;
    }

    .composer {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(720px, 100%);
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: rgba(244, 245, 247, 0.96);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--border);
    }

    .composer-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
    }

    textarea {
        flex: 1;
        resize: none;
        min-height: 44px;
        max-height: 140px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: white;
        outline: none;
    }

    .send-button {
        height: 44px;
        width: 54px;
        padding: 0;
        background: var(--accent);
        color: white;
        font-size: 18px;
    }

    .typing {
        color: var(--muted);
        font-size: 13px;
        padding: 6px 4px;
    }

    .error {
        color: var(--danger);
        font-size: 13px;
        margin-top: 8px;
    }

    @media (min-width: 600px) {
        main {
            padding: 24px;
        }

        header {
            padding: 18px 24px;
        }

        .composer {
            padding-left: 24px;
            padding-right: 24px;
        }
    }
</style>

</head><body><div class="app"><header>
    <div class="header-row">
        <h1>LM Studio Chat</h1>

        <div class="status">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Not connected</span>
        </div>
    </div>
</header>

<main>

    <section class="setup-card">

        <h2>Connection</h2>

        <div class="field">
            <label for="serverUrl">
                LM Studio Server URL
            </label>

            <input
                id="serverUrl"
                type="text"
                value="http://192.168.1.100:1234"
                placeholder="http://192.168.1.100:1234"
            >
        </div>

        <div class="field">
            <label for="model">
                Model
            </label>

            <select id="model">
                <option value="">
                    Load models first
                </option>
            </select>
        </div>

        <div class="row">

            <div class="field">
                <label for="temperature">
                    Temperature
                </label>

                <input
                    id="temperature"
                    type="number"
                    min="0"
                    max="2"
                    step="0.1"
                    value="0.7"
                >
            </div>

            <div class="field">
                <label for="maxTokens">
                    Max Tokens
                </label>

                <input
                    id="maxTokens"
                    type="number"
                    min="1"
                    step="1"
                    value="512"
                >
            </div>

        </div>

        <div class="row">

            <button
                class="button-secondary"
                onclick="loadModels()"
            >
                Load Models
            </button>

            <button
                class="button-secondary"
                onclick="testConnection()"
            >
                Test Connection
            </button>

        </div>

        <div
            id="connectionError"
            class="error"
        ></div>

    </section>

    <section
        id="messages"
        class="messages"
    >

        <div class="message assistant">

            <div class="message-label">
                Assistant
            </div>

            <div class="message-content">
                Connect to your LM Studio server and start chatting.
            </div>

        </div>

    </section>

</main>

<div class="composer">

    <div
        id="typing"
        class="typing"
        style="display: none;"
    >
        Generating response...
    </div>

    <div class="composer-row">

        <textarea
            id="prompt"
            placeholder="Message the model..."
            rows="1"
        ></textarea>

        <button
            id="sendButton"
            class="send-button"
            onclick="sendMessage()"
        >
            ↑
        </button>

    </div>

</div>

</div><script>

    let conversation = [];

    const serverUrlInput =
        document.getElementById("serverUrl");

    const modelSelect =
        document.getElementById("model");

    const messages =
        document.getElementById("messages");

    const promptInput =
        document.getElementById("prompt");

    const sendButton =
        document.getElementById("sendButton");

    const typing =
        document.getElementById("typing");

    const statusDot =
        document.getElementById("statusDot");

    const statusText =
        document.getElementById("statusText");

    const connectionError =
        document.getElementById("connectionError");


    function getBaseUrl() {

        return serverUrlInput.value
            .trim()
            .replace(/\/+$/, "");

    }


    function setStatus(text, state = "") {

        statusText.textContent = text;

        statusDot.className =
            "status-dot " + state;

    }


    async function testConnection() {

        connectionError.textContent = "";

        setStatus("Connecting...");

        try {

            const response = await fetch(
                `${getBaseUrl()}/v1/models`
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data =
                await response.json();

            populateModels(data.data || []);

            setStatus("Connected", "connected");

        } catch (error) {

            setStatus(
                "Connection failed",
                "error"
            );

            connectionError.textContent =
                "Could not connect to LM Studio. Check the IP address, port, network and firewall.";

        }

    }


    async function loadModels() {

        await testConnection();

    }


    function populateModels(models) {

        modelSelect.innerHTML = "";

        if (models.length === 0) {

            modelSelect.innerHTML =
                `<option value="">
                    No models found
                </option>`;

            return;

        }

        models.forEach(model => {

            const option =
                document.createElement("option");

            option.value =
                model.id;

            option.textContent =
                model.id;

            modelSelect.appendChild(option);

        });

    }


    function addUserMessage(content) {

        const message =
            document.createElement("div");

        message.className =
            "message user";

        message.innerHTML = `
            <div class="message-label">
                You
            </div>

            <div class="message-content"></div>
        `;

        message.querySelector(
            ".message-content"
        ).textContent = content;

        messages.appendChild(message);

        scrollToBottom();

    }


    function createAssistantMessage() {

        const message =
            document.createElement("div");

        message.className =
            "message assistant";

        message.innerHTML = `
            <div class="message-label">
                Assistant
            </div>

            <div class="message-content"></div>
        `;

        messages.appendChild(message);

        return message;

    }


    function scrollToBottom() {

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    }


    async function sendMessage() {

        const prompt =
            promptInput.value.trim();

        if (!prompt) {
            return;
        }

        const model =
            modelSelect.value;

        if (!model) {

            alert(
                "Please load and select a model first."
            );

            return;

        }

        addUserMessage(prompt);

        conversation.push({

            role: "user",

            content: prompt

        });

        promptInput.value = "";

        sendButton.disabled = true;

        typing.style.display =
            "block";

        const assistantMessage =
            createAssistantMessage();

        const contentElement =
            assistantMessage.querySelector(
                ".message-content"
            );

        const startTime =
            performance.now();

        let fullResponse = "";

        let completionTokens = 0;

        try {

            const response =
                await fetch(
                    `${getBaseUrl()}/v1/chat/completions`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            model: model,

                            messages: conversation,

                            temperature: Number(
                                document.getElementById(
                                    "temperature"
                                ).value
                            ),

                            max_tokens: Number(
                                document.getElementById(
                                    "maxTokens"
                                ).value
                            ),

                            stream: true

                        })

                    }
                );

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }

            if (!response.body) {

                throw new Error(
                    "Streaming is not supported by this browser."
                );

            }

            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            let buffer = "";

            while (true) {

                const {
                    value,
                    done
                } = await reader.read();

                if (done) {
                    break;
                }

                buffer +=
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );

                const lines =
                    buffer.split("\n");

                buffer =
                    lines.pop();

                for (const line of lines) {

                    const trimmed =
                        line.trim();

                    if (!trimmed) {
                        continue;
                    }

                    if (
                        !trimmed.startsWith(
                            "data:"
                        )
                    ) {
                        continue;
                    }

                    const data =
                        trimmed.slice(5).trim();

                    if (data === "[DONE]") {
                        continue;
                    }

                    try {

                        const json =
                            JSON.parse(data);

                        const delta =
                            json.choices?.[0]
                                ?.delta
                                ?.content;

                        if (delta) {

                            fullResponse +=
                                delta;

                            contentElement.textContent =
                                fullResponse;

                            contentElement.innerHTML =
                                escapeHtml(
                                    fullResponse
                                ) +
                                '<span class="cursor"></span>';

                            scrollToBottom();

                        }

                        if (
                            json.usage
                            ?.completion_tokens
                        ) {

                            completionTokens =
                                json.usage
                                .completion_tokens;

                        }

                    } catch (error) {

                        console.warn(
                            "Could not parse stream chunk:",
                            data
                        );

                    }

                }

            }

            contentElement.textContent =
                fullResponse ||
                "The model returned no text.";

            const endTime =
                performance.now();

            const responseTime =
                endTime - startTime;

            const tokensPerSecond =
                completionTokens > 0
                    ? completionTokens /
                      (responseTime / 1000)
                    : null;

            conversation.push({

                role: "assistant",

                content: fullResponse

            });

            addResponseInfo(
                assistantMessage,
                {

                    responseTime,

                    completionTokens,

                    tokensPerSecond

                }
            );

            setStatus(
                "Connected",
                "connected"
            );

        } catch (error) {

            contentElement.textContent =
                "Error communicating with LM Studio:\n\n" +
                error.message;

            setStatus(
                "Request failed",
                "error"
            );

        } finally {

            sendButton.disabled =
                false;

            typing.style.display =
                "none";

            promptInput.focus();

        }

    }


    function addResponseInfo(
        message,
        info
    ) {

        const details =
            document.createElement(
                "details"
            );

        details.className =
            "response-info";

        const summary =
            document.createElement(
                "summary"
            );

        summary.textContent =
            "Response information";

        const stats =
            document.createElement(
                "div"
            );

        stats.className =
            "stats";

        const responseTime =
            `${(
                info.responseTime / 1000
            ).toFixed(2)} s`;

        const tokensPerSecond =
            info.tokensPerSecond
                ? `${info.tokensPerSecond.toFixed(1)} tok/s`
                : "Unavailable";

        stats.innerHTML = `

            <div class="stat">

                <div class="stat-title">
                    Response time
                </div>

                <div class="stat-value">
                    ${responseTime}
                </div>

            </div>

            <div class="stat">

                <div class="stat-title">
                    Completion tokens
                </div>

                <div class="stat-value">
                    ${info.completionTokens || "—"}
                </div>

            </div>

            <div class="stat">

                <div class="stat-title">
                    Tokens/sec
                </div>

                <div class="stat-value">
                    ${tokensPerSecond}
                </div>

            </div>

        `;

        details.appendChild(summary);

        details.appendChild(stats);

        message.appendChild(details);

    }


    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;

    }


    promptInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    promptInput.addEventListener(
        "input",
        function() {

            this.style.height =
                "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    140
                ) + "px";

        }
    );

</script></body>
</html>
